<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/style.css">
    <title>Create Quiz</title>
</head>
<body>
<main>
    <a href="/">Back to Home</a>
    <h1>Create a New Quiz</h1>

    <div id="quiz-details">
        <input type="text" id="quiz-title" placeholder="Quiz title (Required)"/>
        <input type="text" id="quiz-description" placeholder="Quiz description (Required)"/>
    </div>

    <div id="questions-container"></div>

    <button id="add-question-btn">+ Add Question</button>
    <button id="save-quiz-btn">Save Quiz</button>

    <p id="error-message"></p>

    <script src="/static/create.js"></script>
</main>
</body>
</html>
